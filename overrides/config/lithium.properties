# This is the configuration file for Lithium.
#
# You can find information on editing this file and all the available options here:
# https://github.com/CaffeineMC/lithium-fabric/wiki/Configuration-File
#
# By default, this file will be empty except for this notice.
# Lithium optimized configuration for low-end CPUs (Intel Celeron J1800 / Bay Trail)
# Goal: Reduce stutters while keeping the best performance gains.

ai=true
alloc=true
chunk=false          
collisions=true
collections=true
entity=true
fast_util=true
math=false           
block=false          
nbt=true
shapes=true
world=true
cache_chunkmap=true
chunk_access=true

# Optional experimental settings
lithium.entity.fast_mob_spawning=true
lithium.world.fast_block_light_updates=false